# dsh-progress-osd：作为一层 profile bundle 插入。
# 只注册 host 侧 loader 条目，没有浏览器（client）半边。
#
# config 会原样传给 apply(ctx, config)；这里留空的键用插件默认值。
# 环境变量优先于本文件（见 README）。
- insert:
    - id: progress-osd
      name: 'dsh-progress-osd'
      config:
        # 思考停顿多久才推（毫秒）：每来一段新思考都会重置计时器
        thoughtDebounceMs: 4000
        # 文本上限：顶栏是跑马灯，长句能自己滚；0 表示完全不截断
        maxChars: 400
        # 不弹系统 toast：进度只在顶栏 OSD 显示，收尾用提示音提醒
        notify: false
        notifyLive: false
        sound: true
        soundFile: /usr/share/sounds/freedesktop/stereo/complete.oga
        # 没有 reasoning 通道的模型回退到可见正文
        fallbackToText: true
        # 完成态在顶栏停留 7 秒（默认也是 7 秒，这里写死方便一眼看到）
        doneHoldMs: 7000
        # 收尾时把本轮花费拼进完成提示（读 dsh-cost-meter 的账本，只读不联网）
        showCost: true
        costCurrency: CNY
